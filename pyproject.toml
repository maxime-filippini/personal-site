[project]
name = "personal_site"
version = "0.1.0"
description = "My personal site"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cachetools>=6.1.0",
    "mistune>=3.1.3",
    "jinja2>=3.1.0",
    "python-frontmatter>=1.1.0",
    "htpy>=25.8.1",
    "pygments>=2.19.2",
    "catppuccin[pygments]>=2.5.0",
    "beautifulsoup4>=4.13.5",
    "fastapi[standard]>=0.129.0",
    "pydantic-settings>=2.12.0",
    "r2-client",
]


[tool.hatch.build.targets.wheel]
packages = ["src/personal_site"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88

[tool.ruff.lint.isort]
force-single-line = true

[tool.uv]
dev-dependencies = ["debugpy>=1.8.16"]

[tool.uv.sources]
r2-client = { git = "https://github.com/maxime-filippini/r2_client" }
